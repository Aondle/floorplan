name: 功能想法
description: 能让地图更好用的一件事
labels: [enhancement]
body:
  - type: textarea
    id: goal
    attributes:
      label: 你当时想做什么？
      description: 先写问题，先别写解法。你想弄懂或找到什么，什么挡住了你？
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 什么会有帮助？
      description: 如果你已经有想法，写在这里。
  - type: dropdown
    id: who
    attributes:
      label: 给谁用？
      options:
        - 做了应用但不看代码的人
        - 开发者
        - 两边都是
